<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gym Coach — can't reach the server</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; min-height: 100%; background: #0a0b0f; color: #f4f5f7;
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 26rem; margin: 0 auto; padding: calc(56px + env(safe-area-inset-top)) 24px 32px; }
  .eyebrow { font: 500 11px/1 ui-monospace, monospace; letter-spacing: .09em; text-transform: uppercase; color: #98a0ae; }
  h1 { font-size: 28px; line-height: 1.1; margin: 10px 0 16px; letter-spacing: -.02em; }
  p { color: #98a0ae; margin: 0 0 12px; }
  ol { color: #f4f5f7; padding-left: 20px; margin: 16px 0 28px; } li { margin: 8px 0; }
  button { width: 100%; height: 56px; border: 0; border-radius: 14px; background: #bef264; color: #0a0b0f;
    font: 600 16px system-ui, sans-serif; }
  button:active { transform: scale(.98); }
</style></head>
<body><main>
  <p class="eyebrow">Gym Coach</p>
  <h1>Can't reach your coach</h1>
  <p>The app runs on your own computer and reaches this phone over Tailscale.</p>
  <ol>
    <li>Check that Tailscale is switched on on this phone.</li>
    <li>Check that the computer running Gym Coach is awake.</li>
  </ol>
  <button id="retry">Try again</button>
</main>
<!-- config.js is generated by deploy/build-apk.sh from COACH_PUBLIC_URL (gitignored: it holds your host). -->
<script src="config.js"></script>
<script>
  document.getElementById("retry").onclick = function () {
    window.location.href = window.__GC_URL__ || "/";
  };
</script>
</body></html>
